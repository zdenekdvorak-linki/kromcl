name: Přepis a nasazení

on:
  schedule:
    # Město publikuje zhruba jeden článek denně, hodina stačí s rezervou.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Kolik článků zpracovat v tomhle běhu"
        default: "10"

permissions:
  contents: write   # commit nových JSONů zpátky do repa
  pages: write
  id-token: write

concurrency:
  group: kromka
  cancel-in-progress: false

jobs:
  prepis:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Zpracovat nové články
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KROMKA_SITE_URL: ${{ vars.KROMKA_SITE_URL }}
        run: python -m kromka all --limit ${{ inputs.limit || '10' }}

      - name: Uložit archiv zpátky do repa
        run: |
          git config user.name "kromka-bot"
          git config user.email "kromka-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "obsah: nové články $(date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: nasazeni
        uses: actions/deploy-pages@v4
