name: Přepis a nasazení

on:
  push:
    branches: [main]
    # Commit od bota mění jen data/; bez tohohle by se spouštěl sám dokola.
    paths-ignore: ["data/**"]
  schedule:
    # Město publikuje zhruba jeden článek denně, hodina stačí s rezervou.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Kolik článků zpracovat v tomhle běhu"
        default: "10"

permissions:
  contents: write   # commit nových JSONů zpátky do repa
  pages: write
  id-token: write

concurrency:
  group: kromka
  cancel-in-progress: false

jobs:
  prepis:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.nasazeni.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Zpracovat nové články
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KROMKA_SITE_URL: ${{ vars.KROMKA_SITE_URL }}
          # Příspěvky čtenářů: Apps Script u tabulky odpovědí. Bez nich se přeskočí.
          KROMKA_PRISPEVKY_URL: ${{ secrets.KROMKA_PRISPEVKY_URL }}
          KROMKA_PRISPEVKY_KLIC: ${{ secrets.KROMKA_PRISPEVKY_KLIC }}
          KROMKA_PRISPEVKY_FORMULAR: ${{ vars.KROMKA_PRISPEVKY_FORMULAR }}
        # `all` bere jen články novější než poslední hotový, takže cron
        # nikdy nesáhne na nezpracovaný archiv. Backfill se pouští ručně.
        run: python -m kromka all --limit ${{ inputs.limit || '5' }}

      - name: Uložit archiv zpátky do repa
        run: |
          git config user.name "kromka-bot"
          git config user.email "kromka-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "obsah: nové články $(date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: nasazeni
        uses: actions/deploy-pages@v4

      # Až po nasazení, aby Bing a Seznam na adrese našly novou verzi.
      # Výpadek IndexNow nasazení nezpochybní, proto continue-on-error.
      - name: Nahlásit nové adresy přes IndexNow
        continue-on-error: true
        run: python -m kromka indexnow

      # Také až po nasazení: Facebook si z adresy hned stahuje kartu og:image.
      # Fronta i odeslané jsou v data/facebook.json, proto druhý commit —
      # bez něj by příští běh poslal tentýž článek znovu.
      - name: Sdílet nový článek na Facebook
        continue-on-error: true
        env:
          KROMKA_FB_TOKEN: ${{ secrets.KROMKA_FB_TOKEN }}
          KROMKA_FB_PAGE_ID: ${{ vars.KROMKA_FB_PAGE_ID }}
          KROMKA_SITE_URL: ${{ vars.KROMKA_SITE_URL }}
        run: |
          python -m kromka facebook
          git add data
          git diff --staged --quiet || git commit -m "facebook: odeslaný příspěvek $(date +%F)"
          git push
